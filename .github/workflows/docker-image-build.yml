name: Docker Image Build and Push

on:
  push:
    branches: [ test-stable, community ]
  pull_request:
    branches: [ test-stable, community ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/whit3str/diis-na-server:latest

      - name: Verify built image
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep 'ghcr.io/whit3str/diis-na-server:latest' || true
